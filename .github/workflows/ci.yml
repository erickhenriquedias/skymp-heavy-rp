# CI — roda tudo que dá pra rodar sem um Skyrim e sem um banco.
#
# O que ESTE workflow NÃO cobre, e é bom ter claro: nada do comportamento
# in-game. Os testes do gamemode usam um `mp` mockado, e mock aceita qualquer
# coisa — foi assim que 22 chamadas Papyrus com argumento errado passaram meses
# com a suíte verde. CI verde aqui significa "não quebrou o que já era
# verificado", não "funciona em jogo".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Disparo manual (`gh workflow run CI --ref main` ou o botao "Run workflow"
  # na aba Actions). Existe porque `push` e `pull_request` nem sempre disparam:
  # quando o merge e feito pela API com um token de OAuth app, o GitHub nao
  # cria o evento, e o commit entra na main sem nenhum check-run associado —
  # foi o que aconteceu nos PRs #2 e #3, que entraram verificados so por
  # execucao local. Sem este gatilho nao ha como pedir a verificacao depois,
  # porque `workflow_dispatch` e o unico jeito de invocar um workflow a mao.
  workflow_dispatch:

# Um PR que recebe vários pushes seguidos cancela as execuções antigas em vez de
# enfileirar — feedback mais rápido e menos minuto de runner desperdiçado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      # Não para nos outros serviços quando um falha: é melhor ver todos os
      # problemas de uma vez do que descobrir um por execução.
      fail-fast: false
      matrix:
        include:
          - nome: gamemode
            dir: skymp/gamemode
          - nome: painel web
            dir: apps/web
          - nome: api do jogo
            dir: apps/game-api
          - nome: bot discord
            dir: apps/bot-discord
          - nome: launcher
            dir: apps/launcher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Instalar dependências
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Testes
        working-directory: ${{ matrix.dir }}
        run: npm test

  gamemode-extras:
    name: gamemode — checks e typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: skymp/gamemode/package-lock.json

      - name: Instalar dependências
        working-directory: skymp/gamemode
        run: npm ci

      # Confere migrations, comandos obrigatórios, permissões e flags de ambiente.
      - name: Checks de sistema
        working-directory: skymp/gamemode
        run: npm run test:systems

      # Sem banco no CI, então não dá pra comparar com o schema real. O que dá
      # pra garantir aqui é que o parser continua entendendo as migrations: se
      # uma migration nova usar uma forma de DDL que ele não reconhece, ele
      # passaria a aprovar um banco incompleto — falha silenciosa, que é
      # exatamente o que o checador existe para evitar.
      - name: Schema declarado pelas migrations é legível
        working-directory: skymp/gamemode
        run: npm run check:schema:list

      # Informativo: valida o uso da API `mp` contra types/mp.d.ts. Erros vindos
      # de dentro de node_modules/ws são ruído conhecido, por isso filtramos.
      - name: Typecheck (informativo)
        working-directory: skymp/gamemode
        continue-on-error: true
        run: |
          npm run typecheck 2>&1 | grep -v '^node_modules' || true

  launcher:
    name: launcher — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json

      - name: Instalar dependências
        working-directory: apps/launcher
        run: npm ci

      # `tsc -b` e não `tsc`: o tsconfig.json da raiz é um solution file com
      # `files: []`, então `tsc` sozinho não checa projeto nenhum.
      - name: Typecheck
        working-directory: apps/launcher
        run: npm run typecheck

  higiene:
    name: higiene do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O registro de patches ao SkyMP. Sem dependências, então roda aqui e não
      # na matriz com `npm ci`. Um patch registrado pela metade parece controle
      # e não é — ver patches/README.md.
      - name: Registro de patches é válido
        run: |
          node patches/validate.js
          node --test patches/validate.test.js

      # O .gitignore cobre .env, mas um arquivo já rastreado antes da regra
      # continuaria versionado. Esta checagem é barata e o custo de errar é alto.
      - name: Nenhum .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|staging)$'; then
            echo "::error::Arquivo .env versionado. Segredos nao entram no repositorio."
            exit 1
          fi
          echo "OK: nenhum .env rastreado."

      # Nunca redistribuímos asset da Bethesda — o jogador precisa possuir o jogo.
      - name: Nenhum asset da Bethesda
        run: |
          if git ls-files | grep -iE '\.(esm|bsa)$'; then
            echo "::error::Master ou BSA versionado. Ver LICENSE_AND_AFFILIATION_POLICY.md."
            exit 1
          fi
          echo "OK: nenhum asset da Bethesda."

  # Confere que todo patch registrado ainda aplica limpo sobre o commit fixado
  # em patches/manifest.json.
  #
  # Roda em job próprio porque precisa clonar o upstream (~53 MB), e **sai cedo
  # quando não há patch**: clonar para verificar zero diffs é queimar minuto de
  # runner para produzir a mesma resposta todo dia. Com patch registrado, o job
  # clona o pin e verifica cada diff — ver patches/README.md.
  #
  # `git apply --check` e não `git apply`: responde "aplicaria por inteiro?" sem
  # escrever nada. É o "nunca aplicar patch silenciosamente pela metade" do
  # briefing §12, e sai de graça.
  patches-aplicam:
    name: patches ainda aplicam no upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Há patch registrado?
        id: check
        run: |
          n=$(node -e 'process.stdout.write(String(require("./patches/manifest.json").patches.length))')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "pin=$(node -e 'process.stdout.write(require("./patches/manifest.json").upstream.pin || "")')" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then
            echo "Nenhum patch registrado — nada a verificar."
          fi

      - name: Clonar o SkyMP no commit fixado
        if: steps.check.outputs.count != '0'
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/skyrim-multiplayer/skymp.git /tmp/upstream-skymp
          cd /tmp/upstream-skymp
          # Falha aqui significa que o pin aponta para um commit que não existe
          # mais — reescrita de histórico upstream, ou erro de digitação.
          git checkout --detach "${{ steps.check.outputs.pin }}"

      - name: git apply --check em cada patch
        if: steps.check.outputs.count != '0'
        run: |
          falhou=0
          for f in $(node -e '
            const m = require("./patches/manifest.json");
            process.stdout.write(m.patches.map(p => p.file).join("\n"));
          '); do
            if git -C /tmp/upstream-skymp apply --check "$GITHUB_WORKSPACE/patches/$f"; then
              echo "OK: $f"
            else
              echo "::error file=patches/$f::nao aplica sobre ${{ steps.check.outputs.pin }}. Reavalie o patch antes de remendar — o upstream pode ter resolvido o problema."
              falhou=1
            fi
          done
          exit $falhou

      - name: Aplicar patches no clone para os contract tests
        if: steps.check.outputs.count != '0'
        run: |
          for f in $(node -e '
            const m = require("./patches/manifest.json");
            process.stdout.write(m.patches.map(p => p.file).join("\n"));
          '); do
            git -C /tmp/upstream-skymp apply "$GITHUB_WORKSPACE/patches/$f"
          done

      - name: Contract tests dos patches
        if: steps.check.outputs.count != '0'
        run: |
          npm ci --prefix apps/launcher --ignore-scripts
          SKYMP_SOURCE_DIR=/tmp/upstream-skymp \
            node --test patches/*.contract.test.mjs
